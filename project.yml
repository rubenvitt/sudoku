name: Sudoku

options:
  bundleIdPrefix: dev.rubeen
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  SudokuEngine:
    path: Packages/SudokuEngine

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: H95J852PKP

targets:
  Sudoku:
    type: application
    platform: iOS
    sources:
      - path: Sudoku
    dependencies:
      - package: SudokuEngine
        product: SudokuEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.sudoku
        PRODUCT_NAME: Sudoku
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  SudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SudokuTests
    dependencies:
      - target: Sudoku
      - package: SudokuEngine
        product: SudokuEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.sudoku.tests
        GENERATE_INFOPLIST_FILE: YES

  SudokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SudokuUITests
    dependencies:
      - target: Sudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.sudoku.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sudoku:
    build:
      targets:
        Sudoku: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SudokuTests
        - SudokuUITests
