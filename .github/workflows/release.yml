name: Release

# Releases the approved App Store version from project.yml to customers.
# Only works once Apple has approved it and it waits for a manual release.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "veröffentlichen" to release the approved version
        required: true

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  release:
    # secrets must only reach main
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'veröffentlichen'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"
      - name: Release in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          fastlane release
      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
