name: XcodeGen
description: Installs a pinned, checksum-verified XcodeGen release and generates Sudoku.xcodeproj.

# Pinned instead of `brew install xcodegen`, so a new release (or a tampered bottle) never reaches the jobs that hold
# the App Store Connect key. To update: change VERSION, SHA256 (shasum -a 256 of the release's xcodegen.zip) and COMMIT
# (git ls-remote https://github.com/yonaskolb/XcodeGen refs/tags/VERSION).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 2.46.0
        SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        # The commit the 2.46.0 tag points at, for the fallback below.
        COMMIT: 8445e778451c7e44237b90281bde622d764b0084
      run: |
        ZIP="$RUNNER_TEMP/xcodegen.zip"
        URL="https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
        if curl -sSLf --retry 3 --retry-all-errors --retry-delay 10 -o "$ZIP" "$URL"; then
          echo "$SHA256  $ZIP" | shasum -a 256 -c -
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP"
          XCODEGEN="$RUNNER_TEMP/xcodegen/bin/xcodegen"
        else
          # GitHub's release downloads go down now and then (504) while git keeps working: build the same
          # version from its tag instead, checked against the pinned commit.
          echo "::warning::XcodeGen release download failed; building $VERSION from source"
          SRC="$RUNNER_TEMP/xcodegen-src"
          git clone --quiet --depth 1 --branch "$VERSION" https://github.com/yonaskolb/XcodeGen "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"
          swift build -c release --package-path "$SRC" --product xcodegen
          XCODEGEN="$SRC/.build/release/xcodegen"
        fi
        "$XCODEGEN" generate
